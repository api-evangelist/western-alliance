name: Western Alliance Bank
kind: company
description: >-
  Western Alliance Bancorporation (NYSE: WAL) is a Phoenix, Arizona based
  super-regional bank holding company with roughly $80 billion in assets, operating
  through its principal subsidiary Western Alliance Bank, an Arizona state-chartered
  commercial bank and member FDIC that runs regional divisions including Alliance Bank
  of Arizona, Bank of Nevada, Bridge Bank, and Torrey Pines Bank. It is a commercial-
  and business-banking focused institution rather than a consumer neobank. Western
  Alliance runs a real first-party developer portal, the WAB API Developer Portal
  ("Developer Hub") at developer.westernalliancebank.com, exposing commercial
  Treasury Management open-banking APIs for balance and transaction information,
  check images, funds transfers, and stop payments. Access is partner/customer-gated:
  API specifications are downloaded from the Developer Hub only with WAB-issued
  credentials, and authentication uses OAuth2 client-credentials (Client ID, Client
  Secret), a Client Certificate (mTLS), and access tokens across UAT and Production
  environments. Its APIs are also reachable through payment-platform partners such as
  Modern Treasury. No public consumer FDX or CFPB Section 1033 data-access API is
  documented, and no OpenAPI/Swagger is publicly downloadable.
