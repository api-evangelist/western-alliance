sources:
  - url: https://developer.westernalliancebank.com/s/
    type: DeveloperPortal
    note: WAB API Developer Portal / Developer Hub; live 200; catalog and specs credential-gated.
  - url: https://www.westernalliancebancorporation.com/commercial/treasury-management
    type: Documentation
    note: 'Names the open-banking APIs: "retrieve transaction history, access check images, initiate transfers and stop payments"; links to developer.westernalliancebank.com.'
  - url: https://www.westernalliancebancorporation.com/sites/default/files/2025-05/api-services-terms-conditions.pdf
    type: TermsOfService
    note: Defines Developer Hub URL and auth model (Client ID, Client Secret, Client Certificate, Token) and UAT/Production environments.
  - url: https://www.moderntreasury.com/integrations/western-alliance-bank
    type: Documentation
    note: Aggregator/partner access to Western Alliance Bank via Modern Treasury (ACH, Wire, Check).
actions:
  openapiHarvested: false
  reason: |
    No public OpenAPI/Swagger is downloadable; API specifications require WAB-issued
    Developer Hub credentials. Identity plus honest posture captured; openapi/ left
    empty. Status: built (real first-party developer portal and commercial API
    surface confirmed).
